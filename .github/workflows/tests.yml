name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated CLI regression checks
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate bundled JSON
        run: |
          python -m json.tool references/capabilities.json > /dev/null
          python -m json.tool test-prompts.json > /dev/null
